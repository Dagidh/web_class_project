<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="woodOuter" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8B5A2B" />
      <stop offset="55%" stop-color="#5C3618" />
      <stop offset="100%" stop-color="#331B0A" />
    </radialGradient>

    <radialGradient id="woodInner" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6B4220" />
      <stop offset="70%" stop-color="#452710" />
      <stop offset="100%" stop-color="#2A1507" />
    </radialGradient>

    <linearGradient id="creamGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6" />
      <stop offset="45%" stop-color="#E8CFA0" />
      <stop offset="100%" stop-color="#B89052" />
    </linearGradient>

    <linearGradient id="steelBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F4F7" />
      <stop offset="50%" stop-color="#B0B7C0" />
      <stop offset="100%" stop-color="#68707A" />
    </linearGradient>

    <linearGradient id="planeBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C98A4B" />
      <stop offset="50%" stop-color="#8F5624" />
      <stop offset="100%" stop-color="#522D10" />
    </linearGradient>

    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1A0B03" flood-opacity="0.65" />
    </filter>

    <filter id="carvedInset" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1B0C04" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Outer Emblem Base -->
  <g filter="url(#dropShadow)">
    <circle cx="400" cy="400" r="365" fill="url(#woodOuter)" stroke="#261205" stroke-width="6" />
    <circle cx="400" cy="400" r="345" fill="none" stroke="#9E6938" stroke-width="14" stroke-dasharray="14 8" stroke-linecap="round" />
    <circle cx="400" cy="400" r="345" fill="none" stroke="#2D1607" stroke-width="14" stroke-dasharray="4 18" opacity="0.55" />
    <circle cx="400" cy="400" r="332" fill="none" stroke="#241004" stroke-width="4" />

    <circle cx="400" cy="400" r="302" fill="url(#woodInner)" stroke="#B8864B" stroke-width="3" />
    <circle cx="400" cy="400" r="268" fill="none" stroke="#B8864B" stroke-width="2.5" />
  </g>

  <!-- Traditional Ethiopian Geometric Border Motifs -->
  <g stroke="#D4A66A" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M 118,370 L 145,355 L 152,385 L 122,395 Z" />
    <path d="M 132,320 L 162,312 L 164,342 L 134,348 Z" />
    <path d="M 155,272 L 185,270 L 182,300 L 152,298 Z" />
    <path d="M 188,228 L 216,232 L 208,260 L 180,252 Z" />
    <path d="M 228,190 L 254,200 L 240,226 L 214,212 Z" />
    <path d="M 274,160 L 298,175 L 278,198 L 256,178 Z" />
    <path d="M 326,138 L 346,158 L 322,176 L 304,152 Z" />
    <polygon points="400,104 422,126 400,148 378,126" fill="#5C3618" stroke="#E8CFA0" stroke-width="2.5" />
    <circle cx="400" cy="126" r="4" fill="#E8CFA0" />
    <path d="M 474,138 L 454,158 L 478,176 L 496,152 Z" />
    <path d="M 526,160 L 502,175 L 522,198 L 544,178 Z" />
    <path d="M 572,190 L 546,200 L 560,226 L 586,212 Z" />
    <path d="M 612,228 L 584,232 L 592,260 L 620,252 Z" />
    <path d="M 645,272 L 615,270 L 618,300 L 648,298 Z" />
    <path d="M 668,320 L 638,312 L 636,342 L 666,348 Z" />
    <path d="M 682,370 L 655,355 L 648,385 L 678,395 Z" />
  </g>

  <!-- Upper Inner Semicircle Panel -->
  <path d="M 148,382 A 252,252 0 0,1 652,382 Z" fill="#361C0B" stroke="#C49356" stroke-width="2.5" />

  <!-- Inner Semicircle Carved Filigree -->
  <g stroke="#C49356" stroke-width="2" fill="none" opacity="0.65">
    <path d="M 185,365 Q 220,310 275,335 Q 245,365 185,365 Z" />
    <path d="M 615,365 Q 580,310 525,335 Q 555,365 615,365 Z" />
    <polygon points="275,275 295,260 310,280 290,295" />
    <polygon points="525,275 505,260 490,280 510,295" />
  </g>

  <!-- Ethiopian Cross Emblem -->
  <g filter="url(#carvedInset)">
    <path d="M 400,158 L 418,182 L 408,192 L 408,212 L 432,212 L 444,198 L 466,218 L 444,238 L 432,226 L 408,226 L 408,266 L 392,266 L 392,226 L 368,226 L 356,238 L 334,218 L 356,198 L 368,212 L 392,212 L 392,192 L 382,182 Z" fill="url(#creamGold)" stroke="#2A1406" stroke-width="2.5" stroke-linejoin="round" />
    <polygon points="400,174 407,183 400,192 393,183" fill="#3B1E0B" />
    <polygon points="354,218 362,211 370,218 362,225" fill="#3B1E0B" />
    <polygon points="446,218 438,211 430,218 438,225" fill="#3B1E0B" />
    <circle cx="400" cy="219" r="5" fill="#3B1E0B" />
  </g>

  <!-- Diagonal Woodworking Chisel -->
  <g filter="url(#carvedInset)" transform="rotate(-38 400 315)">
    <rect x="275" y="303" width="78" height="22" rx="10" fill="#6E3B16" stroke="#241004" stroke-width="2.5" />
    <rect x="351" y="305" width="12" height="18" fill="url(#creamGold)" stroke="#241004" stroke-width="2" />
    <polygon points="363,307 478,309 492,314 478,319 363,321" fill="url(#steelBlade)" stroke="#241004" stroke-width="2" />
  </g>

  <!-- Classic Woodworking Hand Plane -->
  <g filter="url(#carvedInset)">
    <polygon points="378,274 398,266 426,342 404,348" fill="url(#steelBlade)" stroke="#241004" stroke-width="2.5" />
    <path d="M 316,342 C 316,328 304,322 304,308 C 304,294 316,288 326,288 C 336,288 348,294 348,308 C 348,322 336,328 336,342 Z" fill="url(#planeBody)" stroke="#241004" stroke-width="2.5" />
    <path d="M 442,342 C 446,315 462,286 486,286 C 502,286 508,298 502,310 C 494,324 486,332 492,344 L 442,344 Z" fill="url(#planeBody)" stroke="#241004" stroke-width="2.5" />
    <path d="M 284,342 L 512,342 L 504,368 L 292,368 Z" fill="url(#planeBody)" stroke="#241004" stroke-width="3" stroke-linejoin="round" />
    <rect x="292" y="362" width="212" height="6" fill="url(#creamGold)" stroke="#241004" stroke-width="1.5" />
  </g>

  <!-- Main Banner Divider Band -->
  <path d="M 112,382 L 688,382 L 672,495 L 128,495 Z" fill="#2A1406" stroke="#C49356" stroke-width="3" />

  <!-- Main Title: ETHIO -->
  <g filter="url(#carvedInset)" fill="url(#creamGold)" stroke="#1C0C03" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 176,403 L 246,403 L 246,421 L 234,421 L 232,415 L 204,415 L 204,433 L 228,433 L 228,445 L 204,445 L 204,465 L 234,465 L 236,458 L 248,458 L 248,477 L 176,477 L 176,467 L 184,465 L 184,415 L 176,413 Z" />
    <path d="M 264,403 L 344,403 L 344,423 L 332,423 L 329,415 L 314,415 L 314,465 L 324,467 L 324,477 L 284,477 L 284,467 L 294,465 L 294,415 L 279,415 L 276,423 L 264,423 Z" />
    <path d="M 360,403 L 396,403 L 396,413 L 388,415 L 388,433 L 420,433 L 420,415 L 412,413 L 412,403 L 448,403 L 448,413 L 440,415 L 440,465 L 448,467 L 448,477 L 412,477 L 412,467 L 420,465 L 420,446 L 388,446 L 388,465 L 396,467 L 396,477 L 360,477 L 360,467 L 368,465 L 368,415 L 360,413 Z" />
    <path d="M 466,403 L 504,403 L 504,413 L 495,415 L 495,465 L 504,467 L 504,477 L 466,477 L 466,467 L 475,465 L 475,415 L 466,413 Z" />
    <path fill-rule="evenodd" d="M 568,401 C 596,401 614,417 614,440 C 614,463 596,479 568,479 C 540,479 522,463 522,440 C 522,417 540,401 568,401 Z M 568,413 C 552,413 544,424 544,440 C 544,456 552,467 568,467 C 584,467 592,456 592,440 C 592,424 584,413 568,413 Z" />
  </g>

  <!-- Subtitle: WOODWORK -->
  <g filter="url(#carvedInset)">
    <circle cx="176" cy="535" r="5.5" fill="url(#creamGold)" stroke="#1C0C03" stroke-width="1.5" />
    <text x="400" y="548" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="42" font-weight="bold" letter-spacing="4.5" text-anchor="middle" fill="#FFF3D1" stroke="#1C0C03" stroke-width="1.2">WOODWORK</text>
    <circle cx="624" cy="535" r="5.5" fill="url(#creamGold)" stroke="#1C0C03" stroke-width="1.5" />
  </g>

  <!-- Decorative Divider Rule -->
  <line x1="255" y1="564" x2="545" y2="564" stroke="#B8864B" stroke-width="1.5" opacity="0.75" />

  <!-- Tagline: TRADITIONAL ARTISANRY -->
  <text x="400" y="592" font-family="Arial, Helvetica, sans-serif" font-size="18.5" font-weight="bold" letter-spacing="3.5" text-anchor="middle" fill="#E8CFA0">TRADITIONAL ARTISANRY</text>

  <!-- Bottom Location: • ETHIOPIA • -->
  <text x="400" y="626" font-family="Georgia, &#39;Times New Roman&#39;, serif" font-size="20.5" font-weight="bold" letter-spacing="4" text-anchor="middle" fill="#FFF3D1">• ETHIOPIA •</text>
</svg>